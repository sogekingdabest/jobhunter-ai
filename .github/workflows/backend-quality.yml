name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --directory backend --locked --all-groups

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install frontend test browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Lint backend
        run: uv run --directory backend ruff check .

      - name: Check backend formatting
        run: uv run --directory backend ruff format --check .

      - name: Type check backend
        run: uv run --directory backend mypy src tests

      - name: Test backend
        run: uv run --directory backend pytest

      - name: Check frontend
        run: pnpm --dir frontend check

