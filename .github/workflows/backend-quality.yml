name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
      JOBHUNTER_DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@127.0.0.1:5432/jobhunter_test
      JOBHUNTER_TEST_DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@127.0.0.1:5432/jobhunter_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: jobhunter_test
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: uv sync --directory backend --locked --all-groups

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install frontend test browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Lint backend
        run: uv run --directory backend ruff check .

      - name: Check backend formatting
        run: uv run --directory backend ruff format --check .

      - name: Type check backend
        run: uv run --directory backend mypy src tests

      - name: Test backend
        run: uv run --directory backend pytest

      - name: Verify database migrations
        run: |
          uv run --directory backend alembic current --check-heads
          uv run --directory backend alembic check

      - name: Check frontend
        run: pnpm --dir frontend check

