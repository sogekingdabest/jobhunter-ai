repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: frontend-lint
        name: frontend lint
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(js|ts|tsx)$
      - id: frontend-typecheck
        name: frontend typecheck
        entry: pnpm --dir frontend typecheck
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(js|ts|tsx)$
